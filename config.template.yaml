# =============================================================================
# LiteLLM Proxy Configuration – Free Models Only (TEMPLATE)
# =============================================================================
# THIS FILE IS THE SINGLE SOURCE OF TRUTH.
#
# It gets rendered at runtime via `render-config.py` (in the repo root)
# into `config.yaml`. Direct edits to `config.yaml` are overwritten on the
# next render.
#
# Placeholder syntax: {{ENV_VAR}} is replaced with the value of the
# corresponding variable in `.env`. If the variable is missing, that
# provider's block is removed entirely from `config.yaml` (except for
# OVHcloud, which supports an anonymous free tier without a key -- there
# "" is substituted).
#
# Aggregates 69 chat, embedding, and audio aliases across 15 free
# providers (OpenRouter, Cerebras, Groq, Cloudflare Workers AI, Google AI
# Studio, NVIDIA NIM, Mistral La Plateforme, Cohere, Poolside, Z.AI,
# ElevenLabs, OpenCode Zen, LLM7.io, HuggingFace Inference API, OVHcloud)
# into a single OpenAI-compatible endpoint with automatic load balancing,
# fallback, and rate-limit cooldown.
#
# Client requests use the `model_name` (e.g. "gpt-oss-120b") and LiteLLM
# routes to one of the backends behind it.
#
# Docs:  https://docs.litellm.ai/docs/proxy/configs
#        https://docs.litellm.ai/docs/proxy/reliability
# =============================================================================

model_list:

