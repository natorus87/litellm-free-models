<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="litellm-free-models banner">
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #0f172a; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .tag { fill: #475569; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    .chip { fill: #475569; font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-weight: 600; }
    .chip-bg { fill: #eef2ff; stroke: #c7d2fe; }
    .spoke { stroke: #a5b4fc; }
    .node { fill: #6366f1; }
    .node-free { fill: #22c55e; }
    .hub-outer { fill: url(#hubGradient); }
    .hub-inner { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .title { fill: #f1f5f9; }
      .tag { fill: #94a3b8; }
      .chip { fill: #c7d2fe; }
      .chip-bg { fill: #1e1b4b; stroke: #3730a3; }
      .spoke { stroke: #4338ca; }
      .node { fill: #818cf8; }
      .node-free { fill: #34d399; }
      .hub-inner { fill: #0d1117; }
    }
  </style>

  <defs>
    <linearGradient id="hubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1200" height="260"/>

  <!-- Hub-and-spoke mark: many free providers converging into one endpoint -->
  <g transform="translate(130,130)">
    <line class="spoke" x1="0" y1="0" x2="-72" y2="-58" stroke-width="3"/>
    <line class="spoke" x1="0" y1="0" x2="-90" y2="4" stroke-width="3"/>
    <line class="spoke" x1="0" y1="0" x2="-68" y2="64" stroke-width="3"/>
    <line class="spoke" x1="0" y1="0" x2="8" y2="92" stroke-width="3"/>
    <line class="spoke" x1="0" y1="0" x2="76" y2="60" stroke-width="3"/>
    <line class="spoke" x1="0" y1="0" x2="88" y2="-10" stroke-width="3"/>
    <line class="spoke" x1="0" y1="0" x2="60" y2="-70" stroke-width="3"/>
    <line class="spoke" x1="0" y1="0" x2="-10" y2="-92" stroke-width="3"/>

    <circle class="node" cx="-72" cy="-58" r="9"/>
    <circle class="node" cx="-90" cy="4" r="9"/>
    <circle class="node-free" cx="-68" cy="64" r="9"/>
    <circle class="node" cx="8" cy="92" r="9"/>
    <circle class="node-free" cx="76" cy="60" r="9"/>
    <circle class="node" cx="88" cy="-10" r="9"/>
    <circle class="node" cx="60" cy="-70" r="9"/>
    <circle class="node-free" cx="-10" cy="-92" r="9"/>

    <circle class="hub-outer" cx="0" cy="0" r="40"/>
    <circle class="hub-inner" cx="0" cy="0" r="30"/>
    <circle class="hub-outer" cx="0" cy="0" r="12"/>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(290,0)">
    <text x="0" y="118" class="title" font-size="52">litellm-free-models</text>
    <text x="2" y="156" class="tag" font-size="22">One OpenAI-compatible endpoint. 13 free LLM APIs. Zero cost.</text>

    <g transform="translate(2,178)">
      <rect class="chip-bg" x="0" y="0" width="122" height="30" rx="15" stroke-width="1"/>
      <text x="61" y="20" class="chip" font-size="14" text-anchor="middle">36 MODELS</text>

      <rect class="chip-bg" x="134" y="0" width="150" height="30" rx="15" stroke-width="1"/>
      <text x="209" y="20" class="chip" font-size="14" text-anchor="middle">RATE-LIMIT AWARE</text>

      <rect class="chip-bg" x="296" y="0" width="146" height="30" rx="15" stroke-width="1"/>
      <text x="369" y="20" class="chip" font-size="14" text-anchor="middle">SELF-HOSTED</text>
    </g>
  </g>
</svg>
