# =============================================================================
# Router Settings  –  Load Balancing, Fallback & Cooldown
# =============================================================================
router_settings:
  # usage-based-routing-v2 routes to deployments that still have tpm/rpm
  # budget (values from litellm_params.tpm/rpm in model_list) -- instead of
  # simple-shuffle hitting an rpm:1 deployment (OpenRouter) just as often
  # as an rpm:40 deployment (LLM7/NVIDIA). With Redis (block below), usage
  # is tracked across instances (master + slaves + replicas) including
  # shared cooldowns; without Redis, LiteLLM falls back to in-memory
  # tracking per instance.
  routing_strategy: usage-based-routing-v2
  # BEGIN REDIS ROUTER (removed by render-config.py when REDIS_HOST is missing)
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  # END REDIS ROUTER
  # Fail fast under sustained free-tier load: one alternate deployment attempt,
  # then the model fallback chain. A failing backend is removed for one minute.
  num_retries: 1
  retry_after: 1
  allowed_fails: 1
  cooldown_time: 60

  fallbacks:
    # Explicit empty chains prevent the generic chat fallback from handling
    # non-chat requests with an incompatible endpoint or vector space.
    - {"embedding-general": []}
    - {"embedding-multilingual": []}
    - {"embedding-code": []}
    - {"embedding-nvidia-text": []}
    - {"embedding-nvidia-vl": []}
    - {"embedding-liquid": []}
    - {"audio-transcription": []}
    - {"audio-speech": []}
    - {"elevenlabs-scribe-v2": []}
    - {"whisper-large-v3": []}
    - {"whisper-large-v3-turbo": []}
    - {"gpt-oss-120b":              ["gpt-oss-20b", "llama-3.3-70b-instruct", "nemotron-3-120b", "mistral-large"]}
