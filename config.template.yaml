# =============================================================================
# LiteLLM Global Settings
# =============================================================================
litellm_settings:
  drop_params: true
  set_verbose: false
  # Per-attempt ceiling for models without a stricter deployment timeout.
  # gpt-oss-120b and its first fallback gpt-oss-20b use 20s above, keeping the
  # normal retry+fallback path below common 90-120s client deadlines.
  request_timeout: 30
  num_retries: 1

  # BEGIN REDIS CACHE
  # ─── Redis Cache ──────────────────────────────────────────────────────────
  # Shared cache between master + all slaves. Reduces latency and rate-limit
  # pressure on upstream providers (identical prompts get served from cache).
  #
  # ⚠️ SEMANTICS NOTE (deliberate decision, see the README's "Response Cache"):
  # Identical requests (model, messages, temperature, ... get hashed) return
  # the byte-identical cached answer within the TTL -- even with
  # temperature > 0. Per-request opt-out via a LiteLLM extension:
  #   {"cache": {"no-cache": true}}  or the  Cache-Control: no-cache  header
  # That's why the TTL is deliberately short (5 min).
  #
  # The `os.environ/...` syntax is resolved by LiteLLM at *runtime* from the
  # process environment, so the same rendered config.yaml works in Docker
  # Compose (REDIS_HOST=redis) and in Kubernetes (REDIS_HOST=litellm-redis).
  #
  # enable_redis_auth_cache: virtual-key lookups are also mirrored to Redis,
  # so multi-replica/multi-instance deployments share auth state and do
  # not hammer Postgres on every request.
  #
  # The entire block is removed by render-config.py when REDIS_HOST is
  # missing/empty in .env (or rendered with --no-redis) -- the proxy then
  # runs without a cache instead of running against an unreachable Redis.
  cache: true
  enable_redis_auth_cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    namespace: "litellm.cache"
    # Response cache: 5 min in Redis
    ttl: 300
    # In-memory tier: 1 min
    default_in_memory_ttl: 60
    max_connections: 50
    # Chat responses and deterministic embeddings are cached. Binary audio
    # responses and multipart transcription requests stay outside the cache.
    supported_call_types:
      - "acompletion"
      - "atext_completion"
      - "aembedding"
  # END REDIS CACHE

# =============================================================================
# General Server Settings
# =============================================================================
general_settings:
  master_key: {{LITELLM_MASTER_KEY}}
  allow_models_on_dynamic_config: false
  # BEGIN CLOUDFLARE IMAGE (removed without Cloudflare key/base)
  # LiteLLM does not yet translate Cloudflare image generation to OpenAI's
  # /v1/images/generations schema. This authenticated native pass-through
  # exposes the free Workers AI SDXL-Lightning endpoint instead.
  pass_through_endpoints:
    - path: "/cloudflare/images/generations"
      target: "{{CLOUDFLARE_IMAGE_API_URL}}"
      headers:
        Authorization: "Bearer os.environ/CLOUDFLARE_API_KEY"
  # END CLOUDFLARE IMAGE
  # 5 min TTL for virtual-key lookups (in-memory + Redis via enable_redis_auth_cache)
  user_api_key_cache_ttl: 300
